version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhaba-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - AI_PROVIDER=fixture
      - DATABASE_URL=sqlite:///./dhaba_support.db
    volumes:
      - backend_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhaba-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
